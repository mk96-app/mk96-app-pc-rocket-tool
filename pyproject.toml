[project]
name = "mk96-app-pc-rocket-tool"
version = "26.10.1"
description = "Windows tray app that plays a distinct sound for each Rocket.Chat chat and mention"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "keyring>=25.7.0",
    "pyside6-addons>=6.12.0",
    "pyyaml>=6.0.3",
]

[project.gui-scripts]
mk96-app-pc-rocket-tool = "mk96_app_pc_rocket_tool.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mk96_app_pc_rocket_tool"]

[tool.pytest]
strict = true
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261113",
]
